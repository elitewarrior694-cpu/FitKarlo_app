{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass p-10 rounded-[2.5rem] border border-white/5 shadow-2xl">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold mb-2">Welcome Back</h2>
            <p class="opacity-50 text-sm">Continue your fitness evolution.</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div class="space-y-1">
                <label class="text-xs font-bold uppercase tracking-wider opacity-40 ml-1">Username</label>
                <input type="text" name="username" required class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-sm">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold uppercase tracking-wider opacity-40 ml-1">Password</label>
                <input type="password" name="password" required class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-sm">
            </div>

            <button type="submit" class="w-full bg-primary py-4 rounded-2xl font-bold text-lg hover:shadow-xl hover:shadow-primary/30 transition-all flex items-center justify-center space-x-2 mt-4">
                <span>Login</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm opacity-50">New to FitKarlo? <a href="/register" class="text-primary font-bold hover:underline">Create an Account</a></p>
        </div>
    </div>
</div>
{% endblock %}
