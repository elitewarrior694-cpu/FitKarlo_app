{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto py-6">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold tracking-tight">AI <span class="text-secondary">Analysis</span></h1>
        <a href="{% url 'fitness:log_nutrition' %}" class="w-10 h-10 glass rounded-full flex items-center justify-center">
            <i data-lucide="x" class="w-5 h-5"></i>
        </a>
    </div>

    <!-- Image Overlay Container -->
    <div class="relative w-full aspect-square rounded-[3rem] overflow-hidden border border-white/5 shadow-2xl mb-8 group">
        <img src="{{ log.image.url }}" class="w-full h-full object-cover">
        
        <!-- Animated Arrows & Benefits -->
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 animate-bounce">
            <div class="bg-secondary text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl flex items-center space-x-2">
                <i data-lucide="arrow-down" class="w-3 h-3"></i>
                <span>High Protein Source</span>
            </div>
            <div class="w-px h-12 bg-secondary mx-auto"></div>
        </div>

        <div class="absolute bottom-1/3 left-1/4 animate-pulse">
            <div class="bg-primary text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl flex items-center space-x-2">
                <i data-lucide="arrow-right" class="w-3 h-3"></i>
                <span>Healthy Fats</span>
            </div>
            <div class="w-16 h-px bg-primary"></div>
        </div>

        <!-- Details Overlay -->
        <div class="absolute bottom-0 left-0 right-0 p-8 pt-20 bg-gradient-to-t from-black to-transparent">
            <div class="flex items-end justify-between">
                <div>
                    <h2 class="text-3xl font-black text-white mb-2">{{ log.food_name }}</h2>
                    <div class="flex space-x-4">
                        <div class="flex items-center space-x-1">
                            <i data-lucide="flame" class="w-4 h-4 text-secondary"></i>
                            <span class="text-sm font-bold text-white">{{ log.calories }} kcal</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <i data-lucide="award" class="w-4 h-4 text-primary"></i>
                            <span class="text-sm font-bold text-white">Score: {{ log.health_score }}/100</span>
                        </div>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold uppercase opacity-50 text-white">Confidence</p>
                    <p class="text-lg font-black text-secondary">98.2%</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Macros List -->
    <div class="grid grid-cols-3 gap-4 mb-8">
        <div class="glass p-6 rounded-[2rem] border border-white/5 text-center">
            <p class="text-[10px] font-bold uppercase opacity-40 mb-1">Protein</p>
            <h3 class="text-xl font-black">{{ log.protein }}g</h3>
        </div>
        <div class="glass p-6 rounded-[2rem] border border-white/5 text-center">
            <p class="text-[10px] font-bold uppercase opacity-40 mb-1">Carbs</p>
            <h3 class="text-xl font-black">{{ log.carbs }}g</h3>
        </div>
        <div class="glass p-6 rounded-[2rem] border border-white/5 text-center">
            <p class="text-[10px] font-bold uppercase opacity-40 mb-1">Fats</p>
            <h3 class="text-xl font-black">{{ log.fats }}g</h3>
        </div>
    </div>

    <button onclick="window.location.href='{% url 'fitness:dashboard' %}'" class="w-full py-5 bg-white text-dark rounded-[2rem] font-black hover:scale-[1.02] transition-all">
        Save to Journal
    </button>
</div>
{% endblock %}
