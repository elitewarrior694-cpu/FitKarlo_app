<!-- templates/fitness/sleep_log.html -->

{% extends 'base.html' %} {% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="glass p-8 rounded-3xl border border-white/10">
    <h2 class="text-2xl font-bold mb-6 text-center">Log Your Sleep 😴</h2>

    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <!-- Sleep Start -->
      <div>
        <label class="text-sm opacity-60">Sleep Time</label>
        <div class="flex gap-2 mt-1">
          <input
            type="time"
            name="sleep_start"
            required
            class="w-full p-3 rounded-xl bg-white/5 border border-white/10"
          />

          <select
            name="start_period"
            class="px-3 rounded-xl bg-white/5 border border-white/10"
          >
            <option>AM</option>
            <option selected>PM</option>
          </select>
        </div>
      </div>

      <!-- Wake Time -->
      <div>
        <label class="text-sm opacity-60">Wake Up Time</label>
        <div class="flex gap-2 mt-1">
          <input
            type="time"
            name="sleep_end"
            required
            class="w-full p-3 rounded-xl bg-white/5 border border-white/10"
          />

          <select
            name="end_period"
            class="px-3 rounded-xl bg-white/5 border border-white/10"
          >
            <option selected>AM</option>
            <option>PM</option>
          </select>
        </div>
      </div>

      <button
        type="submit"
        class="w-full py-3 bg-primary rounded-xl font-bold hover:opacity-90"
      >
        Save Sleep
      </button>
    </form>
  </div>
</div>
{% endblock %}
