{% extends 'base.html' %} {% block content %}
<div class="max-w-4xl mx-auto py-8">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold tracking-tight">
      AI Nutrition <span class="text-secondary">Intelligence</span>
    </h1>
    <a
      href="{% url 'fitness:dashboard' %}"
      class="text-sm opacity-50 hover:opacity-100 flex items-center"
    >
      <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Back to Dashboard
    </a>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- AI Vision / Meal Scanner -->
    <div
      class="glass p-8 rounded-[2.5rem] border border-secondary/20 bg-gradient-to-br from-secondary/5 to-transparent relative overflow-hidden group"
    >
      <div class="absolute top-0 right-0 p-6 opacity-30">
        <i
          data-lucide="camera"
          class="w-12 h-12 text-secondary group-hover:scale-110 transition-transform"
        ></i>
      </div>

      <form id="mealForm" enctype="multipart/form-data">
        {% csrf_token %}
        <div
          class="w-full h-56 bg-white/5 rounded-3xl border border-dashed border-white/20 flex flex-col items-center justify-center space-y-4 mb-6 relative hover:bg-white/10 transition-all"
        >
          <input
            type="file"
            name="meal_image"
            required
            class="absolute inset-0 opacity-0 cursor-pointer"
            onchange="uploadImage(event)"
          />
          <div
            class="w-16 h-16 rounded-full bg-secondary/10 flex items-center justify-center pointer-events-none"
          >
            <i data-lucide="image-plus" class="w-8 h-8 text-secondary"></i>
          </div>
          <span
            class="text-[10px] font-bold uppercase tracking-widest opacity-40 pointer-events-none"
            >Tap to Scan Meal (AI Vision)</span
          >
        </div>
      </form>

      <button
        disabled
        class="w-full bg-secondary/20 text-secondary py-4 rounded-2xl font-bold flex items-center justify-center space-x-2"
      >
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span>Analyze with AI Vision</span>
      </button>
      <div class="mt-4 text-center">
        <a
          href="{% url 'fitness:voice_log' %}"
          class="text-xs font-bold text-primary uppercase tracking-widest hover:underline flex items-center justify-center"
        >
          <i data-lucide="mic" class="w-3 h-3 mr-1"></i> Try Voice Logging
          instead
        </a>
      </div>

      <p class="text-[10px] text-center mt-3 opacity-30 italic">
        Cloud API connection required for live analysis.
      </p>
    </div>

    <!-- Manual Entry Form -->
    <div class="glass p-8 rounded-[2.5rem] border border-white/5 space-y-6">
      <h3 class="font-bold text-lg flex items-center">
        <i data-lucide="type" class="w-5 h-5 text-primary mr-2"></i> Manual
        Logging
      </h3>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1">
          <label
            class="text-[10px] font-bold uppercase tracking-widest opacity-40"
            >What did you eat?</label
          >
          <input
            type="text"
            name="food_name"
            required
            placeholder="e.g. Grilled Chicken Salad"
            class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 focus:border-secondary outline-none transition-all"
          />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1">
            <label
              class="text-[10px] font-bold uppercase tracking-widest opacity-40"
              >Calories (kcal)</label
            >
            <input
              type="number"
              name="calories"
              required
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 focus:border-secondary outline-none transition-all"
            />
          </div>
          <div class="space-y-1">
            <label
              class="text-[10px] font-bold uppercase tracking-widest opacity-40"
              >Protein (g)</label
            >
            <input
              type="number"
              name="protein"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 focus:border-secondary outline-none transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1">
            <label
              class="text-[10px] font-bold uppercase tracking-widest opacity-40"
              >Carbs (g)</label
            >
            <input
              type="number"
              name="carbs"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 focus:border-secondary outline-none transition-all"
            />
          </div>
          <div class="space-y-1">
            <label
              class="text-[10px] font-bold uppercase tracking-widest opacity-40"
              >Fats (g)</label
            >
            <input
              type="number"
              name="fats"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 focus:border-secondary outline-none transition-all"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-white/10 hover:bg-white/20 py-4 rounded-2xl font-bold transition-all border border-white/10 mt-2"
        >
          Log Meal
        </button>
      </form>
    </div>
  </div>
</div>

<div
  id="popup"
  style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  "
>
  <div class="w-[320px]">
    <!-- 🔄 Loading -->
    <div id="loading" class="text-center text-white">
      <h3>Analyzing...</h3>
    </div>

    <!-- ✅ Result Card -->
    <div id="result" style="display: none">
      <div id="mealCard"></div>

      <button
        onclick="saveMeal()"
        class="w-full mt-4 bg-secondary py-3 rounded-xl font-bold"
      >
        OK
      </button>
    </div>
  </div>
</div>

<script>
  let mealData = null;

  async function uploadImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    // 👉 show popup
    document.getElementById("popup").style.display = "flex";
    document.getElementById("loading").style.display = "block";
    document.getElementById("result").style.display = "none";

    let formData = new FormData();
    formData.append("meal_image", file);

    try {
      let res = await fetch("{% url 'fitness:analyze_meal' %}", {
        method: "POST",
        headers: {
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: formData,
      });

      // ❌ Agar error status aaya
      if (!res.ok) {
        throw new Error("Server error");
      }

      let data = await res.json();
      mealData = data;

      // 👉 CARD UI
      const cardHTML = `
<div class="glass p-5 rounded-2xl border border-white/5 hover:bg-white/[0.03] transition-all group">

  <!-- Top -->
  <div class="flex items-center justify-between mb-4">
    <div class="w-10 h-10 rounded-xl bg-green-500/10 flex items-center justify-center text-green-400">
      <i data-lucide="utensils" class="w-5 h-5"></i>
    </div>

    <!-- Health Score -->
    <span class="text-[10px] font-bold px-2 py-1 rounded-full 
      ${
        data.health_score > 75
          ? "bg-green-500/20 text-green-400"
          : data.health_score > 40
            ? "bg-yellow-500/20 text-yellow-400"
            : "bg-red-500/20 text-red-400"
      }">
      ${data.health_score}
    </span>
  </div>

  <!-- Food Name -->
  <h4 class="font-semibold text-sm mb-2 line-clamp-2">
    ${data.food_name}
  </h4>

  <!-- Calories -->
  <p class="text-xl font-black text-secondary mb-3">
    ${data.calories} kcal
  </p>

  <!-- Macros -->
  <div class="grid grid-cols-3 gap-2 text-center text-[11px]">
    <div>
      <p class="opacity-40">P</p>
      <p class="font-bold">${data.protein}g</p>
    </div>
    <div>
      <p class="opacity-40">C</p>
      <p class="font-bold">${data.carbs}g</p>
    </div>
    <div>
      <p class="opacity-40">F</p>
      <p class="font-bold">${data.fats}g</p>
    </div>
  </div>

  <!-- Time -->
  <p class="text-[10px] opacity-30 mt-4">
    Just now
  </p>

</div>
`;
      document.getElementById("mealCard").innerHTML = cardHTML;
      lucide.createIcons();

      // 👉 switch UI
      document.getElementById("loading").style.display = "none";
      document.getElementById("result").style.display = "block";
    } catch (err) {
      console.error("❌ ERROR:", err);

      document.getElementById("loading").innerHTML = `
      <p style="color:red;">Error analyzing image</p>
    `;
    }
  }

  async function saveMeal() {
    await fetch("{% url 'fitness:save_ai_meal' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}",
      },
      body: JSON.stringify(mealData),
    });

    // 👉 redirect
    window.location.href = "{% url 'fitness:dashboard' %}";
  }
</script>
{% endblock %}
