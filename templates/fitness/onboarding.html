{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="text-center mb-12">
        <h1 class="text-4xl font-extrabold mb-4 tracking-tight">Smart <span class="text-gradient">Profiling</span></h1>
        <p class="opacity-50">Tell us about yourself. Our AI will calculate your optimal targets.</p>
    </div>

    <form method="post" class="space-y-8 h-full">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Age -->
            <div class="glass p-6 rounded-3xl space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest opacity-40">Your Age</label>
                <input type="number" name="age" required value="{{ profile.age|default:'' }}" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 focus:border-primary outline-none">
            </div>

            <!-- Gender -->
            <div class="glass p-6 rounded-3xl space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest opacity-40">Gender</label>
                <select name="gender" class="w-full bg-black/40 border border-white/10 rounded-2xl px-4 py-3 focus:border-primary outline-none">
                    <option value="M" {% if profile.gender == 'M' %}selected{% endif %}>Male</option>
                    <option value="F" {% if profile.gender == 'F' %}selected{% endif %}>Female</option>
                    <option value="O" {% if profile.gender == 'O' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <!-- Height -->
            <div class="glass p-6 rounded-3xl space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest opacity-40">Height (cm)</label>
                <input type="number" step="0.1" name="height" required value="{{ profile.height|default:'' }}" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 focus:border-primary outline-none">
            </div>

            <!-- Weight -->
            <div class="glass p-6 rounded-3xl space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest opacity-40">Weight (kg)</label>
                <input type="number" step="0.1" name="weight" required value="{{ profile.weight|default:'' }}" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 focus:border-primary outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Activity Level -->
            <div class="glass p-8 rounded-[2.5rem] space-y-4">
                <h3 class="font-bold text-lg">Daily Routine</h3>
                <div class="space-y-3">
                    <label class="flex items-center space-x-3 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                        <input type="radio" name="work_type" value="S" {% if profile.work_type == 'S' %}checked{% endif %} class="w-4 h-4 accent-primary">
                        <span class="text-sm font-medium">Sedentary (Office/Remote)</span>
                    </label>
                    <label class="flex items-center space-x-3 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                        <input type="radio" name="work_type" value="A" {% if profile.work_type == 'A' %}checked{% endif %} class="w-4 h-4 accent-primary">
                        <span class="text-sm font-medium">Active (Regular exercise)</span>
                    </label>
                    <label class="flex items-center space-x-3 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                        <input type="radio" name="work_type" value="VA" {% if profile.work_type == 'VA' %}checked{% endif %} class="w-4 h-4 accent-primary">
                        <span class="text-sm font-medium">Very Active (High physical job)</span>
                    </label>
                </div>
            </div>

            <!-- Goals -->
            <div class="glass p-8 rounded-[2.5rem] space-y-4">
                <h3 class="font-bold text-lg">Primary Goal</h3>
                <div class="space-y-3">
                    <label class="flex items-center space-x-3 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                        <input type="radio" name="goal" value="WL" {% if profile.goal == 'WL' %}checked{% endif %} class="w-4 h-4 accent-secondary">
                        <span class="text-sm font-medium">Weight Loss</span>
                    </label>
                    <label class="flex items-center space-x-3 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                        <input type="radio" name="goal" value="MG" {% if profile.goal == 'MG' %}checked{% endif %} class="w-4 h-4 accent-secondary">
                        <span class="text-sm font-medium">Muscle Gain</span>
                    </label>
                    <label class="flex items-center space-x-3 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                        <input type="radio" name="goal" value="MT" {% if profile.goal == 'MT' %}checked{% endif %} class="w-4 h-4 accent-secondary">
                        <span class="text-sm font-medium">Maintenance</span>
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary py-5 rounded-[2rem] font-bold text-xl hover:shadow-2xl hover:scale-[1.02] transition-all">
            Calculate AI Plan
        </button>
    </form>
</div>
{% endblock %}
